[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gedebate"
version = "0.0.1"
description = "Does debate improve encoding-fragile LLM graph reasoning?"
requires-python = ">=3.11"
# Core deps are light + CPU-only, so the data layer (P1) installs and tests
# locally without pulling the GPU stack.
dependencies = [
    "networkx>=3.0",
    "numpy>=1.26",
    "tqdm>=4.67",
]

[project.optional-dependencies]
# The inference stack. Installed on the cluster (see slurm/setup_env.sh).
# Pins mirror the sibling `nlp` repo, already validated on the RTX 2080 nodes.
inference = [
    "torch==2.5.1",
    "transformers==4.49.0",
    "accelerate==1.3.0",
    "huggingface-hub==0.29.3",
    "sentencepiece==0.2.0",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
