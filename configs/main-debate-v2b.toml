# Full debate re-run under the REVISED v2 prompts (all three roles), main.
#
# Why a new out_dir rather than results/v2-main: the runner skips already-done
# instances, so pointing at the existing dir would either write nothing or silently mix
# rows from two different prompt texts. results/v2-main keeps the ORIGINAL v2 output
# and is never touched.
#
# `prompt_version` is still "v2" -- v2 was edited in place rather than forked to a v3 --
# so the version field alone does NOT distinguish these rows from results/v2-main.
# What separates them is this out_dir and the manifest's git_commit (7550f63 or later;
# write .git_commit during the sync so the cluster records it, see cluster-runbook.md).
#
# Changed since results/v2-main, all three prompts:
#   Proposer  an edge involves the node whether written first or second; edge_existence
#             asks for the pair "in either order"; connected_nodes answers with the node
#             at the other end of each edge.
#   Critic    AGREE gets its own evidence bullet; cited edges must involve the queried
#             node; the verdict judges the ANSWER, not the tidiness of the claims.
#   Revision  the graph is named as the only source of truth, and the answer may stand.
#
# Everything else is identical to configs/main-debate-v2.toml, so a delta against
# those rows is the prompt text and nothing else.

model = "Qwen/Qwen2.5-3B-Instruct"
condition = "debate"
dataset = "data/main.jsonl"

n_samples = 10
max_new_tokens = 256

prompt_version = "v2"

tasks = ["node_degree", "connected_nodes", "edge_existence"]
encodings = ["adjacency", "incident", "friendship"]

out_dir = "results/v2b-main"
