# Baseline run config (P2). The single source of truth for the model id.
# P3 fans the full 3x3 matrix out by editing `tasks`/`encodings` here + `--shard`.

model = "Qwen/Qwen2.5-3B-Instruct"   # fits 11GB fp16; swap to a 4-bit 7B here if needed
condition = "baseline"

# P2 slice: one task x one encoding. Widen these two lists for the P3 matrix.
tasks = ["edge_existence"]
encodings = ["adjacency"]

n_graphs = 20
dataset_seed = 7
max_new_tokens = 64

out_dir = "results/p2-baseline"
