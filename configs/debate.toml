# Full debate run over the frozen dataset, into the shared results/main dir (debate/
# joins baseline/ and majority_vote/ for matched-compute joins). Critic v3 (adopted).
#
# `tasks` grows as each task's Proposer/revision prompts are approved (per-task, the
# experiment's core). node_degree is approved; connected_nodes + edge_existence are
# pending approval, then added here. The run is resumable, so appending a task and
# re-submitting only does the new cells.

model = "Qwen/Qwen2.5-3B-Instruct"
condition = "debate"
dataset = "data/main.jsonl"

# debate response BUDGET (max turns), matched to majority-vote's N. Greedy decoding.
n_samples = 10
max_new_tokens = 256

tasks = ["node_degree", "connected_nodes", "edge_existence"]
encodings = ["adjacency", "incident", "friendship"]

out_dir = "results/main"
