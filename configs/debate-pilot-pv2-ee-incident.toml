# Debate PILOT, Proposer prompt v2: edge_existence x incident. The second-worst cell for
# turn-1 parse loss (0.12 unparsed) and a DIFFERENT cause from connected_nodes/friendship:
# there is no label-space bug here ("Yes or No" names no labels), the answers simply never
# reach an ANSWER: line (99 of 600 turn-1 turns lack one). So this cell tests the other
# half of v2, dropping the fill-in template, on its own (docs/findings.md 3d).
#
# It is also the cell where the loop hurts most (-0.058, p=0.014) and where the Critic has
# its strongest discrimination but worst bias (detection 0.97, false alarm 0.82), so a
# clean turn-1 here is the precondition for reading anything about the loop.
#
# Isolated throwaway out_dir; results/main holds the paired v1 rows for the same seed-7
# instances. ONE variable changes vs v1: prompt_version.

model = "Qwen/Qwen2.5-3B-Instruct"
condition = "debate"
dataset = "data/main.jsonl"

n_samples = 10
max_new_tokens = 256

prompt_version = "v2"

tasks = ["edge_existence"]
encodings = ["incident"]

out_dir = "results/debate-pilot-pv2-ee"
