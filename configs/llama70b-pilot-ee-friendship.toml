# COMPLIANCE PILOT 1 of 2, Llama-3.3-70B via Together: edge_existence x friendship.
#
# Purpose is to answer one question before any money goes on the full matrix: does
# Proposer prompt v2, which was frozen against Qwen2.5-3B's failure modes, still produce
# parseable output under a different model's chat template? The success criterion is
# MECHANICAL, not accuracy. Nothing here is a result; it is a go/no-go on the matrix.
#
# Why this cell: it is the only remaining compliance failure in the v2 matrix. Under
# Qwen-3B it runs 53 of 600 turn-1 answers truncated and 52 unparsed (0.087), the worst
# parse loss of the nine cells, and docs/findings.md 3e flags the 256-token cap there as
# "the obvious suspect and untested". Eight of nine cells sit below 2.4 percent unparsed,
# so this is where a template change is most likely to show, and running it settles the
# cap question at the same time.
#
# Read it with:
#   python scripts/debate_diagnostics.py results/llama70b-pilot-ee-friendship
# and compare turn1_truncated / turn1_unparsed against the Qwen-3B numbers above. A
# truncation rate at or above Qwen's means raise the cap before running the matrix; a
# rate near zero means v2 transfers and the cap is fine as frozen.
#
# max_new_tokens stays at 256 deliberately. Changing the cap and the model at once would
# make a truncation delta unattributable, and the cap is one of the things under test.

model = "meta-llama/Llama-3.3-70B-Instruct-Turbo"
provider = "together"
condition = "debate"
dataset = "data/main.jsonl"

# Debate response BUDGET (max turns), matched to majority-vote's N, as in the matrix.
# Greedy (no temperature/top_p/top_k), identical decoding to the committed v2 run.
n_samples = 10
max_new_tokens = 256

prompt_version = "v2"

tasks = ["edge_existence"]
encodings = ["friendship"]

# Throwaway dir: this is a compliance check, not an arm, and must never be pooled with
# the Qwen rows in results/v2-*. Token counts here come from Llama's tokenizer.
out_dir = "results/llama70b-pilot-ee-friendship"
