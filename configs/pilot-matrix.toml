# P2.5 full-matrix smoke: one pass over every task x encoding on real GPU, small N.
# NOT a measurement (8 graphs is noisy) -- it exists to shake out real-3B-output
# parsing across the whole matrix before P3 spends real compute. P3 will reuse this
# exact shape with a large n_graphs.

model = "Qwen/Qwen2.5-3B-Instruct"
condition = "baseline"

tasks = ["edge_existence", "node_degree", "connected_nodes"]
encodings = ["adjacency", "incident", "friendship"]

n_graphs = 8
dataset_seed = 7
max_new_tokens = 128   # connected_nodes lists can be longer than a Yes/No

out_dir = "results/p2-pilot-matrix"
