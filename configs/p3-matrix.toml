# Full-matrix baseline run over the frozen dataset artifact. The vote and debate
# conditions reuse the same dataset (data/main.jsonl) at matched compute; keep it stable.

model = "Qwen/Qwen2.5-3B-Instruct"
condition = "baseline"
dataset = "data/main.jsonl"

# tasks/encodings default to the whole dataset; list a subset here to filter.
tasks = ["edge_existence", "node_degree", "connected_nodes"]
encodings = ["adjacency", "incident", "friendship"]

max_new_tokens = 128

# One shared experiment dir; conditions live in subfolders (baseline/, then
# majority_vote/, debate/) so matched-compute can join them.
out_dir = "results/main"
