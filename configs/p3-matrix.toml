# P3 full-matrix baseline run over the frozen dataset artifact.
# P4/P5 reuse the same dataset (data/main.jsonl) at matched compute; keep this stable.

model = "Qwen/Qwen2.5-3B-Instruct"
condition = "baseline"
dataset = "data/main.jsonl"

# tasks/encodings default to the whole dataset; list a subset here to filter.
tasks = ["edge_existence", "node_degree", "connected_nodes"]
encodings = ["adjacency", "incident", "friendship"]

max_new_tokens = 128

# One shared experiment dir; conditions live in subfolders (baseline/, then
# majority_vote/ in P4, debate/ in P5) so matched-compute can join them.
out_dir = "results/main"
