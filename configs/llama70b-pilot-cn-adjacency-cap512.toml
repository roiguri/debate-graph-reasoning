# COMPLIANCE PILOT 2, RETRY at a 512-token cap.
# Supersedes llama70b-pilot-cn-adjacency.toml, which failed its mechanical check.
#
# What the 256-cap run showed (200 seed-7 instances, results/llama70b-pilot-cn-adjacency):
# Llama-3.3-70B is far more verbose than the Qwen2.5-3B the prompt was frozen against,
# and runs into the cap on both sides of the loop.
#
#                          Qwen-3B      Llama-70B @256
#   turn-1 truncated             3                  22
#   Proposer truncation     6/340              36/224  (0.16)
#   Critic truncation       0/242              82/210  (0.39)
#   Critic unparsed verdicts     1              74      (0.35)
#
# The Critic column is why this is a blocker rather than a blemish. `conditions.debate`
# defaults an unparseable verdict to AGREE **and breaks the loop**, so at 256 roughly a
# third of instances in this cell end in a fake consensus manufactured by the token cap.
# Worse, `diagnostics._count_verdicts` folds those defaulted verdicts into the AGREE
# cells of the confusion matrix (`unparsed` is only a side counter), so the cap also
# inflates the Critic's apparent precision. Neither the loop effect nor the Critic
# statistics can be read off a run with that much truncation.
#
# ONE variable changes against the 256 run: max_new_tokens. Same model, same prompt
# version, same greedy decoding, same instances, so the delta is the cap.
#
# Success is again MECHANICAL: Critic unparsed verdicts and truncation should fall to
# roughly the low single digits, matching what edge_existence/friendship already achieves
# at 256. Accuracy from 200 instances of one cell is not a result and is not the check.
#
# If this passes, 512 should become the cap for the WHOLE Llama matrix rather than a
# per-cell setting -- a cap that varies by cell is a confound, and the edge_existence
# pilot that passed at 256 can only get cleaner at 512 (a higher cap strictly removes
# truncations). The cost of that choice is more generated tokens, which has to be checked
# against findings.md 2: debate must stay under majority vote's budget, or the
# matched-compute argument there stops holding.

model = "meta-llama/Llama-3.3-70B-Instruct-Turbo"
provider = "together"
condition = "debate"
dataset = "data/main.jsonl"

n_samples = 10
max_new_tokens = 512

prompt_version = "v2"

tasks = ["connected_nodes"]
encodings = ["adjacency"]

# Fresh dir: the runner resumes by skipping completed instances, so re-running the 256
# dir would write nothing. Keeping both also makes the cap comparison reproducible.
out_dir = "results/llama70b-pilot-cn-adjacency-cap512"
